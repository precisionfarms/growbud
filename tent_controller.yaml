datetime:
  # Example Date
  - platform: template
    id: start_date
    type: date
    name: Start Date
    optimistic: yes
    restore_value: true
    on_value: 
      then:
         - lambda: !lambda |-  
            ESPTime current_date = x;
            if(!current_date.is_valid())
              ESP_LOGD("custom", "Not Valid");  

            uint8_t day_of_month = x.day_of_month;
            uint8_t month = x.month;
            uint16_t year = x.year;

            if(year > 0){
            
              ESP_LOGD("main", "Day of Month: %s",  std::to_string(day_of_month)); 

              std::tm my_time = {};
              my_time.tm_year = year - 1900; // Years since 1900
              my_time.tm_mon = month - 1;      // Months since January (0-11)
              my_time.tm_mday = day_of_month;        // Day of the month (1-31)
              my_time.tm_hour = 0;        // Hours since midnight (0-23)
              my_time.tm_min = 0;         // Minutes after the hour (0-59)
              my_time.tm_sec = 0;          // Seconds after the minute (0-59)
              my_time.tm_isdst = -1;       // Let mktime determine if DST applies

              //ESP_LOGD("main", "TEST: %s", id(days_in_veg).state);            
              
              uint32_t days_in_veg_val = id(days_in_veg).state;

              if(id(days_in_veg).state > 0){  
                ESP_LOGD("main", "TEST: %u", days_in_veg_val);            
              }

              int days_to_add = days_in_veg_val; // Add 7 days
              
              const time_t ONE_DAY = 24 * 60 * 60;

              time_t timestamp = mktime(&my_time) + (days_to_add * ONE_DAY);
              
              ESPTime esptime_local = esphome::ESPTime::from_epoch_local(timestamp);
              std::string formatted_time = esptime_local.strftime("%Y-%m-%d");
              
              ESP_LOGD("custom", "Bloom Date Timestamp: %u", formatted_time);  
              ESP_LOGD("custom", "Date: %s", current_date.strftime("%Y").c_str());     
              ESP_LOGD("main", "Updated month: %u", month);

              if (x.month >= 8) {
                ESP_LOGD("main", "Updated hour is later or equal to 8");
                
              } else {
                ESP_LOGD("main", "Updated hour is earlier than 8");
              }
              
              id(bloom_date) = timestamp;
              //id(the_bloom_date).state = formatted_time;
                          
              the_bloom_date->publish_state(formatted_time);              

              auto now = id(ha_time).now();
              
              int days_since = (now.timestamp - timestamp)/86400;
              
              id(days_blooming)->publish_state(std::to_string(days_since));
              
              uint8_t bloom_day = esptime_local.day_of_month;
              uint8_t bloom_month = esptime_local.month;
              uint16_t bloom_year = esptime_local.year;

              ESP_LOGD("main", "Bloom Year: %u", bloom_year);
              ESP_LOGD("main", "Bloom Month: %u", bloom_month);
              ESP_LOGD("main", "Bloom Day: %u", bloom_day);

              my_time = {};
              my_time.tm_year = bloom_year - 1900; // Years since 1900
              my_time.tm_mon = bloom_month - 1;      // Months since January (0-11)
              my_time.tm_mday = bloom_day;        // Day of the month (1-31)
              my_time.tm_hour = 0;        // Hours since midnight (0-23)
              my_time.tm_min = 0;         // Minutes after the hour (0-59)
              my_time.tm_sec = 0;          // Seconds after the minute (0-59)
              my_time.tm_isdst = -1;       // Let mktime determine if DST applies

              days_to_add = id(days_in_bloom).state; // Add 7 days
              
              //const time_t ONE_DAY = 24 * 60 * 60;

              timestamp = mktime(&my_time) + (days_to_add * ONE_DAY);
              
              esptime_local = esphome::ESPTime::from_epoch_local(timestamp);
              formatted_time = esptime_local.strftime("%Y-%m-%d");
              
              ESP_LOGD("custom", "Harvest Date: %s", formatted_time.c_str());  

              ESP_LOGI("main", "My Time %u", my_time);   

              ESP_LOGI("custom", "ESPTime Local: %d", esptime_local); // esptime_local is an ESPTime struct
                
              auto off_time_widget = id(the_off_time);
          
              the_harvest_date->publish_state(formatted_time);   

              ESP_LOGD("main", "Bloom Start Date Day of Month: %s",  std::to_string(bloom_day));
             
            }
            else{
              the_harvest_date->publish_state(NULL);   
            }

