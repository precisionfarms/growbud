substitutions:
  id_prefix: growbud_test
  name_prefix: "GrowBud Test"

packages:
  growbud: !include ../growbud.yaml

esphome:
  name: growbud-test
  friendly_name: GrowBud Test
  min_version: 2025.5.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: "growbud-validation-only"
  password: "not-a-real-password"

# Deployment configurations can override ESPHome's build-environment timezone
# when the build host does not use the grow site's timezone.
time:
  - id: !extend growbud_time
    timezone: America/Denver
