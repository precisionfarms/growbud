  - platform: template
    name: "Reservoir Measurement Status"
    id: reservoir_measurement_status
    update_interval: never
  - platform: template
    name: "pH Measurement Status"
    id: ph_measurement_status
    update_interval: never
  - platform: template
    name: "EC Measurement Status"
    id: ec_measurement_status
    update_interval: never
  - platform: template
    name: "EZO EC Response"
    id: ezo_ec_response 
