  - platform: template
    id: veg_transition
    min_value: 0
    max_value: 14
    step: 1
    name: Veg Transition
    optimistic: yes
    restore_value: True
    on_value: 
      then:
        - lambda: |-
            auto start_year = id(start_date).year;
            ESP_LOGI("main", "Value of my datetime: %04d-%02d-%02d", id(start_date).year, id(start_date).month, id(start_date).day);
            ESP_LOGD("main", "Updated hour is earlier than %d", static_cast<int>(start_year));
  - platform: template
    id: bloom_transition
    min_value: 0
    max_value: 14
    step: 1
    name: Bloom Transition
    optimistic: yes  
    restore_value: true
  - platform: template    
    id: days_in_veg
    min_value: 1
    max_value: 90
    step: 1
    initial_value: 30
    name: Days in Veg
    optimistic: yes
    restore_value: True     
    mode: BOX  
    on_value: 
      then:
        - lambda: !lambda |-
            auto start_date_value = id(start_date);
            if (start_date_value->year > 0) {
              esphome::ESPTime start{};
              start.year = start_date_value->year;
              start.month = start_date_value->month;
              start.day_of_month = start_date_value->day;
              auto cycle = id(growbud_controller).calculate_grow_cycle(
                  start, static_cast<int>(x), static_cast<int>(id(days_in_bloom).state));
              id(bloom_date) = cycle.bloom.timestamp;
              the_bloom_date->publish_state(cycle.bloom.strftime("%Y-%m-%d"));
              the_harvest_date->publish_state(cycle.harvest.strftime("%Y-%m-%d"));
            } else {
              the_harvest_date->publish_state("");
            }
  
  - platform: template    
    id: days_in_bloom
    min_value: 30
    max_value: 90
    step: 1
    initial_value: 60
    name: Days in Bloom
    optimistic: yes
    restore_value: True     
    mode: BOX  
    on_value: 
      then:
        - lambda: !lambda |-
            if (id(start_date)->year > 0) {
              auto bloom_time = esphome::ESPTime::from_epoch_local(id(bloom_date));
              auto harvest = id(growbud_controller).add_calendar_days(bloom_time, static_cast<int>(x));
              the_harvest_date->publish_state(harvest.strftime("%Y-%m-%d"));
            } else {
              the_harvest_date->publish_state("");
            }
  
  - platform: template    
    id: ph_target
