uart:
  id: ec_uart
  tx_pin: 22
  rx_pin: 23
  parity: NONE
  stop_bits: 1
  data_bits: 8
  baud_rate: 9600
globals:
  - id: ${id_prefix}_my_global_int
    type: int
    restore_value: no
  - id: lights_on_time
    type: int
    restore_value: yes   
  - id: lights_off_time
    type: int
    restore_value: yes 
  - id: harvest_date
    type: int
    restore_value: yes   
  - id: bloom_date
    type: int
    restore_value: yes    
  - id: ${id_prefix}_global_pump_run_time
    type: int
    restore_value: no     
  - id: test_ec
    type: float
    restore_value: no
  - id: ${id_prefix}_lights_on
    type: bool
    restore_value: yes
    max_restore_data_length: 24
    initial_value: "false"             
  - id: last_ph_reading
    type: float
    restore_value: yes
  - id: next_run_timestamp
    type: long
    restore_value: no
    initial_value: '0'
  - id: ${id_prefix}_pump_run_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ${id_prefix}_pump_run_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ${id_prefix}_pump_max_runtime_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
# Example configuration entry
switch:
  - platform: gpio
    pin: GPIO26
    name: Pump
    id: ${id_prefix}_pump_switch
    inverted: true
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio    
    pin: GPIO27
    id: ${id_prefix}_light_switch
    name: Lights

# Example configuration entry
sensor:
  - platform: ezo
    id: ph_ezo
    address: 0x63
    unit_of_measurement: "pH"
    name: pH
    accuracy_decimals: 2
    update_interval: never
    i2c_id: bus_a
    on_value:
      then:
        - globals.set:
            id: last_ph_reading
            value: !lambda 'return x;'
  - platform: ezo
    id: ec_ezo
    address: 0x64
    # This is for the primary conductivity reading
    update_interval: never
    i2c_id: bus_a
    on_custom: 
      then:
        - lambda: !lambda |-
            ESP_LOGD("custom", "Received custom response from EC sensor: %s", x.c_str());
            std::string csv_string = x.c_str();
            std::vector<std::string> parts;            
            char * token;
            char seps[] = ",";
            token = strtok (&csv_string[0],seps);
            while (token != NULL)
            {
              parts.push_back(token);
              token = strtok (NULL, seps);
            }
            
            id(ezo_ec_response).publish_state(csv_string);
            auto test = id(test_ec);

            // Publish the parsed values to the respective template sensors
            if (parts.size() >= 4) {
              float ec = parse_number<float>(parts[0]).value_or(0.0);

              id(ec_value).publish_state(ec);

              float tds = parse_number<float>(parts[1]).value_or(0.0);
              id(tds_value).publish_state(tds);
              
              float salinity = parse_number<float>(parts[2]).value_or(0.0);
              id(salinity_value).publish_state(salinity);

              float sg = parse_number<float>(parts[3]).value_or(0.0);
              id(sg_value).publish_state(sg);
            }               
  - platform: template
    id: ec_value
    name: ${name_prefix} Conductivity (EC)
    unit_of_measurement: "µS/cm"
    state_class: measurement    
  - platform: template
    id: tds_value
    name: TDS
    unit_of_measurement: "ppm"
    state_class: measurement
    icon: "mdi:antenna"
  - platform: template
    id: salinity_value
    name: "Salinity"
    unit_of_measurement: "psu"
    state_class: measurement
  - platform: template
    id: sg_value
    name: "Specific Gravity"
    state_class: measurement  
  - platform: template
    name: "Last Stored pH"
    id: last_stored_ph_sensor
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    lambda: 'return id(last_ph_reading);'
    update_interval: 60s # Updates the dashboard entity every minute

text_sensor:
  - platform: template
    name: "EZO EC Response"
    id: ezo_ec_response 
  - platform: template
    name: "On Time"
    id: the_on_time    
  - platform: template
    name: "Off Time"
    id: the_off_time
  - platform: template
    name: "Next Pump Time"
    id: next_pump_run_time    
  - platform: template
    name: "Harvest Date"
    id: the_harvest_date
  - platform: template
    name: "Bloom Date"
    id: the_bloom_date
  - platform: template
