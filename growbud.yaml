substitutions:
  timezone: America/Denver
  growbud_component_source: github://precisionfarms/growbud@main
  reservoir_trigger_pin: GPIO32
  reservoir_echo_pin: GPIO33
  reservoir_settling_delay: 60s

external_components:
  - source: ${growbud_component_source}
    components: [growbud]
    # The remote package and external component have separate ESPHome caches.
    # Refresh floating refs so main cannot pair new YAML with stale C++.
    refresh: always

growbud:
  id: growbud_controller

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(last_stored_ph_sensor).publish_state(NAN);
        - script.execute: ${id_prefix}_publish_chemistry_status
        - script.execute: ${id_prefix}_read_reservoir

i2c:
  sda: GPIO18
  scl: GPIO19
  scan: true
  id: bus_a
  frequency: 100k
  timeout: 
    milliseconds: 15000
      
