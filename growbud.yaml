time:
  - platform: sntp
    id: growbud_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - script.execute: ${id_prefix}_script
    on_time:
      # Every 1 minute
      - seconds: 0
        minutes: /1
        then:
          - script.execute: ${id_prefix}_script
interval:
  # Retain time-based chemistry freshness while publishing only status changes.
  - interval: 15s
    id: ${id_prefix}_chemistry_freshness_check
    then:
      - script.execute: ${id_prefix}_publish_chemistry_status
  - interval: 1s
    id: ${id_prefix}_pump_watchdog
    then:
      - if:
          condition:
            lambda: |-
              return id(growbud_controller).pump().watchdog_should_stop(
                  id(${id_prefix}_pump_switch).state, millis());
          then:
            - logger.log:
                level: ERROR
                tag: pump
                format: "Pump maximum runtime exceeded; forcing pump off."
            - script.stop: ${id_prefix}_run_pump
            - script.execute: ${id_prefix}_complete_pump_run
  - interval: 30min    
    startup_delay: 
      minutes: 20
    id: ${id_prefix}_pump_timer 
    then:
    #   - switch.toggle: ${id_prefix}_pump_switch
    #   - delay: 30s
    #   - switch.turn_off: ${id_prefix}_pump_switch
    #   - component.update: ph_ezo
