time:
  - platform: sntp
    id: growbud_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - script.execute: ${id_prefix}_script
    on_time:
      # Every 1 minute
      - seconds: 0
        minutes: /1
        then:
          - script.execute: ${id_prefix}_script
interval:
  - interval: 1s
    id: ${id_prefix}_pump_watchdog
    then:
      - lambda: |-
          if (!id(${id_prefix}_pump_switch).state) {
            id(${id_prefix}_pump_run_active) = false;
            return;
          }

          if (!id(${id_prefix}_pump_run_active) ||
              static_cast<uint32_t>(millis() - id(${id_prefix}_pump_run_started_ms)) >=
                  id(${id_prefix}_pump_max_runtime_ms)) {
            ESP_LOGE("pump", "Pump maximum runtime exceeded; forcing pump off.");
            id(${id_prefix}_pump_switch).turn_off();
            id(${id_prefix}_pump_run_active) = false;
          }
  - interval: 30min    
    startup_delay: 
      minutes: 20
    id: ${id_prefix}_pump_timer 
    then:
