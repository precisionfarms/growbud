uart:
  id: ec_uart
  tx_pin: 22
  rx_pin: 23
  parity: NONE
  stop_bits: 1
  data_bits: 8
  baud_rate: 9600
globals:
  - id: ${id_prefix}_my_global_int
    type: int
    restore_value: no
  - id: lights_on_time
    type: int
    restore_value: yes   
  - id: lights_off_time
    type: int
    restore_value: yes 
  - id: harvest_date
    type: int
    restore_value: yes   
  - id: bloom_date
    type: int
    restore_value: yes    
  - id: test_ec
    type: float
    restore_value: no
  - id: ${id_prefix}_lights_on
    type: bool
    restore_value: yes
    max_restore_data_length: 24
    initial_value: "false"             
  - id: next_run_timestamp
    type: long
    restore_value: no
    initial_value: '0'
# Example configuration entry
switch:
  - platform: gpio
    pin: GPIO26
    name: Pump
    id: ${id_prefix}_pump_switch
    inverted: true
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: Pump
    id: ${id_prefix}_manual_pump_switch
    restore_mode: DISABLED
    lambda: |-
      return id(${id_prefix}_pump_switch).state;
    turn_on_action:
      - lambda: |-
          id(${id_prefix}_run_pump).execute(static_cast<int>(id(pump_duration).state));
    turn_off_action:
      - if:
          condition:
            switch.is_on: ${id_prefix}_pump_switch
          then:
            - script.stop: ${id_prefix}_run_pump
            - script.execute: ${id_prefix}_complete_pump_run
  - platform: gpio    
    pin: GPIO27
    id: ${id_prefix}_light_switch
    name: Lights

# Example configuration entry
sensor:
  # HC-SR04 ECHO must be level-shifted to approximately 3.3 V before this pin.
  - platform: ultrasonic
    id: reservoir_raw_distance
    name: "Reservoir Raw Distance"
    trigger_pin: ${reservoir_trigger_pin}
    echo_pin: ${reservoir_echo_pin}
    timeout: 2m
    pulse_time: 10us
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - multiply: 100
    on_value:
      then:
        - lambda: |-
            if (!id(growbud_controller).reservoir().record_distance(x)) {
              ESP_LOGW("reservoir", "Ignoring invalid reservoir distance.");
            }
        - script.execute: ${id_prefix}_publish_reservoir
  - platform: ezo
    id: ph_ezo
    address: 0x63
    unit_of_measurement: "pH"
    name: pH
    accuracy_decimals: 2
    update_interval: 60s
    i2c_id: bus_a
    on_value:
      then:
        - lambda: |-
            if (!id(growbud_controller).chemistry().record_ph(x, millis())) {
              ESP_LOGW("chemistry", "Ignoring invalid pH measurement.");
            } else {
              id(last_stored_ph_sensor).publish_state(
                  id(growbud_controller).chemistry().last_ph());
            }
        - script.execute: ${id_prefix}_publish_chemistry_status
  - platform: ezo
    id: ec_ezo
    address: 0x64
    # This is for the primary conductivity reading
    update_interval: 60s
    i2c_id: bus_a
    on_value:
      then:
        - lambda: |-
            if (!id(growbud_controller).chemistry().record_ec(x, millis())) {
              ESP_LOGW("chemistry", "Ignoring invalid conductivity measurement.");
              return;
            }
            id(ec_value).publish_state(x);
        - script.execute: ${id_prefix}_publish_chemistry_status
    on_custom: 
      then:
        - lambda: !lambda |-
            ESP_LOGD("custom", "Received custom response from EC sensor: %s", x.c_str());
            id(ezo_ec_response).publish_state(x);

            std::vector<std::string> parts;
            size_t start = 0;
            while (start <= x.size()) {
              const size_t separator = x.find(',', start);
              if (separator == std::string::npos) {
                parts.push_back(x.substr(start));
                break;
              }
              parts.push_back(x.substr(start, separator - start));
              start = separator + 1;
            }

            if (parts.size() < 4) {
              id(growbud_controller).chemistry().mark_ec_failed();
              ESP_LOGW("chemistry", "Ignoring incomplete EC response: '%s'", x.c_str());
              return;
            }

            const auto ec = parse_number<float>(parts[0]);
            const auto tds = parse_number<float>(parts[1]);
            const auto salinity = parse_number<float>(parts[2]);
            const auto sg = parse_number<float>(parts[3]);
            if (!ec.has_value() || !tds.has_value() || !salinity.has_value() || !sg.has_value() ||
                !std::isfinite(*ec) || !std::isfinite(*tds) ||
                !std::isfinite(*salinity) || !std::isfinite(*sg)) {
              id(growbud_controller).chemistry().mark_ec_failed();
              ESP_LOGW("chemistry", "Ignoring malformed EC response: '%s'", x.c_str());
              return;
            }

            id(ec_value).publish_state(*ec);
            id(tds_value).publish_state(*tds);
            id(salinity_value).publish_state(*salinity);
            id(sg_value).publish_state(*sg);
            id(growbud_controller).chemistry().record_ec(*ec, millis());
        - script.execute: ${id_prefix}_publish_chemistry_status
  - platform: template
    id: ec_value
    name: ${name_prefix} Conductivity (EC)
    unit_of_measurement: "µS/cm"
    state_class: measurement    
  - platform: template
    id: tds_value
    name: TDS
    unit_of_measurement: "ppm"
    state_class: measurement
    icon: "mdi:antenna"
  - platform: template
    id: salinity_value
    name: "Salinity"
    unit_of_measurement: "psu"
    state_class: measurement
  - platform: template
    id: sg_value
    name: "Specific Gravity"
    state_class: measurement  
  - platform: template
    name: "Last Stored pH"
    id: last_stored_ph_sensor
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    name: "Reservoir Distance"
    id: reservoir_distance
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Reservoir Level"
    id: reservoir_level
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Reservoir Volume"
    id: reservoir_volume
    unit_of_measurement: "gal"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never

