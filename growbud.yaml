script:
  - id: ${id_prefix}_run_pump
    mode: single
    parameters:
      run_duration_seconds: int
    then:
      - lambda: |-
          int bounded_duration_seconds = run_duration_seconds;
          if (bounded_duration_seconds < 1) bounded_duration_seconds = 1;
          if (bounded_duration_seconds > 300) bounded_duration_seconds = 300;

          id(${id_prefix}_pump_run_started_ms) = millis();
          id(${id_prefix}_pump_max_runtime_ms) = static_cast<uint32_t>(bounded_duration_seconds) * 1000U;
          id(${id_prefix}_pump_run_active) = true;
          id(${id_prefix}_pump_switch).turn_on();
          ESP_LOGI("pump", "Pump running for %d seconds.", bounded_duration_seconds);
      - delay: !lambda |-
          return id(${id_prefix}_pump_max_runtime_ms);
      - lambda: |-
          id(${id_prefix}_pump_switch).turn_off();
          id(${id_prefix}_pump_run_active) = false;
          ESP_LOGI("pump", "Pump turned off after bounded run.");

          id(ph_ezo).send_custom("R");
          auto ph = id(ph_ezo).state;
          auto target = id(ph_target).state;

          if (ph > target) {
            ESP_LOGD("main", "Dosing Down. Current pH: %.3f", ph);
          } else if (ph < target) {
            ESP_LOGD("main", "Dosing Up. Current pH: %.3f", ph);
          }
  - id: ${id_prefix}_script2
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) return;
        int hour = now.hour;
        int minute = now.minute;
  - id: ${id_prefix}_pump_script
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) {
          ESP_LOGW("pump", "Time is invalid; skipping scheduled irrigation evaluation.");
          return;
        }
        auto current_timestamp = now.timestamp; 
        
        ESP_LOGW("pump", "PUMP TIMESTAMP: %ld", (long) current_timestamp);
        
        auto current_run_time = id(${id_prefix}_global_pump_run_time);
        ESP_LOGW("pump", "PUMP RUN TIME: %ld", (long) current_run_time);
        
        // Determine interval duration
        int duration_minutes = id(lights_off_pump_interval).state;
        if (id(${id_prefix}_light_switch).state) {
          ESP_LOGI("pump", "Light switch is ON");
          duration_minutes = id(lights_on_pump_interval).state;
          
        } else {
          ESP_LOGI("pump", "Light switch is OFF");
        }
        
        int duration_seconds = duration_minutes * 60;

        // Initialize global run time if unset
        if (current_run_time == 0) {
          ESP_LOGD("pump", "Current run time is 0. Initializing next run time...");
          current_run_time = current_timestamp + duration_seconds;
          id(${id_prefix}_global_pump_run_time) = current_run_time;

          esphome::ESPTime next_esptime = esphome::ESPTime::from_epoch_local(current_run_time);                
          char next_formatted[32];
          next_esptime.strftime(next_formatted, sizeof(next_formatted), "%Y-%m-%d %I:%M %p");
  
          id(next_pump_run_time).publish_state(next_formatted);
        }
        else{
          //current_run_time = current_timestamp + duration_seconds;
        }
             
        // Format string for Next Pump Run Time
        esphome::ESPTime esptime_local = esphome::ESPTime::from_epoch_local(current_run_time);
        char formatted_time[32];
        esptime_local.strftime(formatted_time, sizeof(formatted_time), "%Y-%m-%d %I:%M %p");

        // Update text sensor on boot / initial calculation
        if (!id(next_pump_run_time).has_state()) {
            id(next_pump_run_time).publish_state(formatted_time);
            ESP_LOGI("pump", "Initial text sensor value set: %s", formatted_time);
        }  
        
        ESP_LOGD("pump", "The next pump time is: %s", formatted_time);
        
        long pump_timer_duration = id(pump_duration).state;
          
        // Trigger pump execution
        if (current_timestamp >= current_run_time && !id(${id_prefix}_pump_switch).state) {
            id(${id_prefix}_run_pump).execute(static_cast<int>(pump_timer_duration));

            auto next_run = current_timestamp + duration_seconds;
            id(${id_prefix}_global_pump_run_time) = next_run;

            esphome::ESPTime next_esptime = esphome::ESPTime::from_epoch_local(next_run);
            char next_formatted[32];
            next_esptime.strftime(next_formatted, sizeof(next_formatted), "%Y-%m-%d %I:%M %p");

            id(next_pump_run_time).publish_state(next_formatted);
            ESP_LOGD("pump", "Setting next pump time to: %s", next_formatted);
        }
                
  - id: ${id_prefix}_lights_script
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) {
          ESP_LOGW("lights", "Time is invalid; leaving the light relay unchanged.");
          return;
        }

        auto start_date_value = id(start_date);
        if (start_date_value->year <= 0) {
          ESP_LOGW("lights", "Grow start date is not configured; leaving the light relay unchanged.");
          return;
        }

        const bool is_blooming = now.timestamp > id(bloom_date);
        esphome::select::Select *lights_on_select =
            is_blooming ? static_cast<esphome::select::Select *>(id(bloom_lights_on_time))
                        : static_cast<esphome::select::Select *>(id(select_lights_on_time));
        const auto start_index = lights_on_select->active_index();
        const std::string start_option =
            start_index.has_value() ? lights_on_select->at(start_index.value()).value_or("00:00") : "00:00";
        const float duration_hours =
            is_blooming
                ? id(bloom_lights_duration).state
                : id(veg_lights_duration).state;

        const int start_hour = atoi(start_option.substr(0, 2).c_str());
        const time_t duration_seconds =
            static_cast<time_t>(duration_hours * 3600.0f + 0.5f);

        esphome::ESPTime today_start_local = now;
        today_start_local.hour = start_hour;
        today_start_local.minute = 0;
        today_start_local.second = 0;

        const char *runtime_tz = getenv("TZ");
        ESP_LOGI("lights_tz", "Configured timezone: ${timezone}; runtime TZ: %s", runtime_tz != nullptr ? runtime_tz : "<unset>");
        ESP_LOGI("lights_tz", "now fields: %04d-%02d-%02d %02d:%02d:%02d; epoch: %ld",
                 now.year, now.month, now.day_of_month, now.hour, now.minute, now.second,
                 static_cast<long>(now.timestamp));
        ESP_LOGI("lights_tz", "parsed lights-on: %02d:00", start_hour);
        ESP_LOGI("lights_tz", "local fields before conversion: %04d-%02d-%02d %02d:%02d:%02d",
                 today_start_local.year, today_start_local.month,
                 today_start_local.day_of_month, today_start_local.hour,
                 today_start_local.minute, today_start_local.second);

        today_start_local.recalc_timestamp_local();
        const time_t today_start = today_start_local.timestamp;
        const time_t today_off = today_start + duration_seconds;

        auto start_utc_diagnostic = esphome::ESPTime::from_epoch_utc(today_start);
        auto start_local_diagnostic = esphome::ESPTime::from_epoch_local(today_start);
        auto now_utc_diagnostic = esphome::ESPTime::from_epoch_utc(now.timestamp);
        auto now_local_diagnostic = esphome::ESPTime::from_epoch_local(now.timestamp);
        ESP_LOGI("lights_tz", "local conversion epoch: %ld", static_cast<long>(today_start));
        ESP_LOGI("lights_tz", "local conversion epoch as UTC: %s",
                 start_utc_diagnostic.strftime("%Y-%m-%d %H:%M:%S").c_str());
        ESP_LOGI("lights_tz", "local conversion epoch as local: %s",
                 start_local_diagnostic.strftime("%Y-%m-%d %H:%M:%S").c_str());
        ESP_LOGI("lights_tz", "now epoch as UTC: %s",
                 now_utc_diagnostic.strftime("%Y-%m-%d %H:%M:%S").c_str());
        ESP_LOGI("lights_tz", "now epoch as local: %s",
                 now_local_diagnostic.strftime("%Y-%m-%d %H:%M:%S").c_str());

        time_t window_start = today_start;
        time_t window_off = today_off;
        bool lights_should_be_on =
            now.timestamp >= today_start && now.timestamp < today_off;

        if (now.timestamp < today_start) {
          esphome::ESPTime previous_start_local =
              esphome::ESPTime::from_epoch_local(today_start - 1);
          previous_start_local.hour = start_hour;
          previous_start_local.minute = 0;
          previous_start_local.second = 0;
          previous_start_local.recalc_timestamp_local();

          const time_t previous_start = previous_start_local.timestamp;
          const time_t previous_off = previous_start + duration_seconds;

          if (now.timestamp >= previous_start && now.timestamp < previous_off) {
            window_start = previous_start;
            window_off = previous_off;
            lights_should_be_on = true;
          }
        }

        id(lights_on_time) = static_cast<int>(window_start);
        id(lights_off_time) = static_cast<int>(window_off);

        auto on_local = esphome::ESPTime::from_epoch_local(window_start);
        auto off_local = esphome::ESPTime::from_epoch_local(window_off);
        id(the_on_time).publish_state(on_local.strftime("%Y-%m-%d %I:%M%p"));
        id(the_off_time).publish_state(off_local.strftime("%Y-%m-%d %I:%M%p"));

        ESP_LOGI(
            "lights",
            "%s schedule: %.1f hours starting at %s; relay should be %s.",
            is_blooming ? "Bloom" : "Vegetative",
            duration_hours,
            start_option.c_str(),
            lights_should_be_on ? "ON" : "OFF");

        const bool light_is_on = id(${id_prefix}_light_switch).state;
        if (lights_should_be_on && !light_is_on) {
          id(${id_prefix}_light_switch).turn_on();
          id(${id_prefix}_lights_on) = true;
          id(${id_prefix}_global_pump_run_time) = 0;
          ESP_LOGI("lights", "Turning lights on.");
        } else if (!lights_should_be_on && light_is_on) {
          id(${id_prefix}_light_switch).turn_off();
          id(${id_prefix}_lights_on) = false;
          id(${id_prefix}_global_pump_run_time) = 0;
          ESP_LOGI("lights", "Turning lights off.");
        }

  - id: ${id_prefix}_script
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) {
          ESP_LOGW("lights", "Time is invalid; skipping lighting and irrigation schedule evaluation.");
          return;
        }

        auto start_date_value = id(start_date);
        if (start_date_value->year > 0) {
          id(${id_prefix}_lights_script).execute();
          id(${id_prefix}_pump_script).execute();
        }
