datetime:
  # Example Date
  - platform: template
    id: start_date
    type: date
    name: Start Date
    optimistic: yes
    restore_value: true
    on_value: 
      then:
         - lambda: !lambda |-  
            ESPTime current_date = x;
            if(!current_date.is_valid())
              ESP_LOGD("custom", "Not Valid");  

            uint8_t day_of_month = x.day_of_month;
            uint8_t month = x.month;
            uint16_t year = x.year;

            if(year > 0){
            
              ESP_LOGD("main", "Day of Month: %d", static_cast<int>(day_of_month));

              //ESP_LOGD("main", "TEST: %s", id(days_in_veg).state);            
              
              uint32_t days_in_veg_val = id(days_in_veg).state;

              if(id(days_in_veg).state > 0){  
                ESP_LOGD("main", "TEST: %" PRIu32, days_in_veg_val);
              }

              int days_to_add = days_in_veg_val; // Add 7 days
              
              ESPTime calculated_date = current_date;
              calculated_date.hour = 0;
              calculated_date.minute = 0;
              calculated_date.second = 0;
              calculated_date.recalc_timestamp_local();
              calculated_date = esphome::ESPTime::from_epoch_local(calculated_date.timestamp);
              for (int i = 0; i < days_to_add; i++) calculated_date.increment_day();
              calculated_date.recalc_timestamp_local();
              time_t timestamp = calculated_date.timestamp;
              
              ESPTime esptime_local = esphome::ESPTime::from_epoch_local(timestamp);
              std::string formatted_time = esptime_local.strftime("%Y-%m-%d");
              
              ESP_LOGD("custom", "Bloom Date Timestamp: %s", formatted_time.c_str());
              ESP_LOGD("custom", "Date: %s", current_date.strftime("%Y").c_str());     
              ESP_LOGD("main", "Updated month: %d", static_cast<int>(month));

              if (x.month >= 8) {
                ESP_LOGD("main", "Updated hour is later or equal to 8");
                
              } else {
                ESP_LOGD("main", "Updated hour is earlier than 8");
              }
              
              id(bloom_date) = timestamp;
              //id(the_bloom_date).state = formatted_time;
                          
              the_bloom_date->publish_state(formatted_time);              

              auto now = id(growbud_time).now();
              if (now.is_valid()) {
                esphome::ESPTime today = now;
                today.hour = 0;
                today.minute = 0;
                today.second = 0;
                today.recalc_timestamp_utc(false);
                esptime_local.hour = 0;
                esptime_local.minute = 0;
                esptime_local.second = 0;
                esptime_local.recalc_timestamp_utc(false);
                int days_since = (today.timestamp - esptime_local.timestamp) / 86400;
                id(days_blooming)->publish_state(std::to_string(days_since));
              }
              
              uint8_t bloom_day = esptime_local.day_of_month;
              uint8_t bloom_month = esptime_local.month;
              uint16_t bloom_year = esptime_local.year;

              ESP_LOGD("main", "Bloom Year: %d", static_cast<int>(bloom_year));
              ESP_LOGD("main", "Bloom Month: %d", static_cast<int>(bloom_month));
              ESP_LOGD("main", "Bloom Day: %d", static_cast<int>(bloom_day));

              days_to_add = id(days_in_bloom).state; // Add 7 days
              calculated_date = esptime_local;
              for (int i = 0; i < days_to_add; i++) calculated_date.increment_day();
              calculated_date.hour = 0;
              calculated_date.minute = 0;
              calculated_date.second = 0;
              calculated_date.recalc_timestamp_local();
              timestamp = calculated_date.timestamp;
              
              esptime_local = esphome::ESPTime::from_epoch_local(timestamp);
              formatted_time = esptime_local.strftime("%Y-%m-%d");
              
              ESP_LOGD("custom", "Harvest Date: %s", formatted_time.c_str());  

              ESP_LOGI("custom", "ESPTime Local: %s", formatted_time.c_str());
                
              auto off_time_widget = id(the_off_time);
          
              the_harvest_date->publish_state(formatted_time);   

              ESP_LOGD("main", "Bloom Start Date Day of Month: %d", static_cast<int>(bloom_day));
             
            }
            else{
              the_harvest_date->publish_state("");
            }

