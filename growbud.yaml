datetime:
  # Example Date
  - platform: template
    id: start_date
    type: date
    name: Start Date
    optimistic: yes
    restore_value: true
    on_value: 
      then:
         - lambda: !lambda |-  
            if (x.year > 0) {
              auto cycle = id(growbud_controller).calculate_grow_cycle(
                  x, static_cast<int>(id(days_in_veg).state),
                  static_cast<int>(id(days_in_bloom).state));
              id(bloom_date) = cycle.bloom.timestamp;
              the_bloom_date->publish_state(cycle.bloom.strftime("%Y-%m-%d"));
              the_harvest_date->publish_state(cycle.harvest.strftime("%Y-%m-%d"));
              auto now = id(growbud_time).now();
              if (now.is_valid()) {
                int days_since = id(growbud_controller).calendar_days_since(now, cycle.bloom);
                id(days_blooming)->publish_state(std::to_string(days_since));
              }
            } else {
              the_harvest_date->publish_state("");
            }

