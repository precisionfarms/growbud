    #       }else if(ph < id(ph_target).state){
    #         ESP_LOGD("main", "Dosing Up. Current pH: %.3f", ph);
    #       }    

  - interval: 1min
    id: ${id_prefix}_lights_timer 
    then:
      - lambda: !lambda |-
          id(${id_prefix}_lights_timer);
  - interval: 5min
    id: value_updates
    then:
      - lambda: |-
          auto now = id(growbud_time).now();
          if (!now.is_valid()) return;
          long bloom_timestamp = id(bloom_date);

          auto bloom_time = esphome::ESPTime::from_epoch_local(bloom_timestamp);
          esphome::ESPTime today = now;
          today.hour = 0;
          today.minute = 0;
          today.second = 0;
          today.recalc_timestamp_utc(false);
          bloom_time.hour = 0;
          bloom_time.minute = 0;
          bloom_time.second = 0;
          bloom_time.recalc_timestamp_utc(false);
          int days_since = (today.timestamp - bloom_time.timestamp) / 86400;
          id(days_blooming)->publish_state(std::to_string(days_since));

