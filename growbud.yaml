script:
  - id: ${id_prefix}_publish_chemistry_status
    mode: restart
    then:
      - lambda: |-
          const std::string ph_status = esphome::growbud::measurement_status_string(
              id(growbud_controller).chemistry().ph_status(millis()));
          if (!id(ph_measurement_status).has_state() ||
              id(ph_measurement_status).state != ph_status) {
            id(ph_measurement_status).publish_state(ph_status);
          }

          const std::string ec_status = esphome::growbud::measurement_status_string(
              id(growbud_controller).chemistry().ec_status(millis()));
          if (!id(ec_measurement_status).has_state() ||
              id(ec_measurement_status).state != ec_status) {
            id(ec_measurement_status).publish_state(ec_status);
          }
  - id: ${id_prefix}_publish_reservoir
    mode: restart
    then:
      - lambda: |-
          auto &reservoir = id(growbud_controller).reservoir();
          id(reservoir_distance).publish_state(
              reservoir.has_accepted_distance() ? reservoir.distance_cm() : NAN);

          const float level = reservoir.level_fraction(
              id(reservoir_full_distance).state,
              id(reservoir_empty_distance).state);
          id(reservoir_level).publish_state(
              std::isfinite(level) ? level * 100.0f : NAN);
          id(reservoir_volume).publish_state(reservoir.volume_gallons(
              id(reservoir_full_distance).state,
              id(reservoir_empty_distance).state,
              id(reservoir_capacity).state));
          id(reservoir_measurement_status).publish_state(
              esphome::growbud::measurement_status_string(reservoir.status(
                  id(reservoir_full_distance).state,
                  id(reservoir_empty_distance).state)));
  - id: ${id_prefix}_read_reservoir
    mode: restart
    then:
      - lambda: |-
          id(growbud_controller).reservoir().measurement_requested();
      - component.update: reservoir_raw_distance
  - id: ${id_prefix}_post_pump_reservoir
    mode: restart
    then:
      - delay: ${reservoir_settling_delay}
      - script.execute: ${id_prefix}_read_reservoir
  - id: ${id_prefix}_complete_pump_run
    mode: restart
    then:
      - switch.turn_off: ${id_prefix}_pump_switch
      - lambda: |-
          id(growbud_controller).pump().complete();
          ESP_LOGI("pump", "Pump turned off after bounded run.");
      - component.update: ph_ezo
      - script.execute: ${id_prefix}_post_pump_reservoir
  - id: ${id_prefix}_run_pump
    mode: single
    parameters:
      run_duration_seconds: int
    then:
      - lambda: |-
          if (!id(growbud_controller).pump().begin(run_duration_seconds, millis())) return;
          int bounded_duration_seconds =
              esphome::growbud::PumpState::bounded_duration_seconds(run_duration_seconds);
          id(${id_prefix}_pump_switch).turn_on();
          ESP_LOGI("pump", "Pump running for %d seconds.", bounded_duration_seconds);
      - delay: !lambda |-
          return id(growbud_controller).pump().maximum_runtime_ms();
      - script.execute: ${id_prefix}_complete_pump_run
  - id: ${id_prefix}_script2
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) return;
        int hour = now.hour;
        int minute = now.minute;
  - id: ${id_prefix}_pump_script
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) {
          ESP_LOGW("pump", "Time is invalid; skipping scheduled irrigation evaluation.");
          return;
        }
        int duration_minutes = id(lights_off_pump_interval).state;
        if (id(${id_prefix}_light_switch).state) {
          ESP_LOGI("pump", "Light switch is ON");
          duration_minutes = id(lights_on_pump_interval).state;
        } else {
          ESP_LOGI("pump", "Light switch is OFF");
        }
        auto evaluation = id(growbud_controller).evaluate_irrigation(
            now.timestamp, duration_minutes, id(${id_prefix}_pump_switch).state);
        esphome::ESPTime esptime_local = esphome::ESPTime::from_epoch_local(evaluation.next_run);
        char formatted_time[32];
        esptime_local.strftime(formatted_time, sizeof(formatted_time), "%Y-%m-%d %I:%M %p");
        if (evaluation.initialized || evaluation.run_due || !id(next_pump_run_time).has_state()) {
          id(next_pump_run_time).publish_state(formatted_time);
        }
        ESP_LOGD("pump", "The next pump time is: %s", formatted_time);
        if (evaluation.run_due) {
          id(${id_prefix}_run_pump).execute(static_cast<int>(id(pump_duration).state));
        }
                
  - id: ${id_prefix}_lights_script
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) {
          ESP_LOGW("lights", "Time is invalid; leaving the light relay unchanged.");
          return;
        }

        auto start_date_value = id(start_date);
        if (start_date_value->year <= 0) {
          ESP_LOGW("lights", "Grow start date is not configured; leaving the light relay unchanged.");
          return;
        }

        const bool is_blooming = now.timestamp > id(bloom_date);
        esphome::select::Select *lights_on_select =
            is_blooming ? static_cast<esphome::select::Select *>(id(bloom_lights_on_time))
                        : static_cast<esphome::select::Select *>(id(select_lights_on_time));
        const auto start_index = lights_on_select->active_index();
        const std::string start_option =
            start_index.has_value() ? lights_on_select->at(start_index.value()).value_or("00:00") : "00:00";
        const float duration_hours =
            is_blooming
                ? id(bloom_lights_duration).state
                : id(veg_lights_duration).state;

        auto schedule = id(growbud_controller).calculate_lighting_schedule(
            now, atoi(start_option.substr(0, 2).c_str()), duration_hours);

        id(lights_on_time) = static_cast<int>(schedule.window_start);
        id(lights_off_time) = static_cast<int>(schedule.window_off);

        auto on_local = esphome::ESPTime::from_epoch_local(schedule.window_start);
        auto off_local = esphome::ESPTime::from_epoch_local(schedule.window_off);
        id(the_on_time).publish_state(on_local.strftime("%Y-%m-%d %I:%M%p"));
        id(the_off_time).publish_state(off_local.strftime("%Y-%m-%d %I:%M%p"));

        ESP_LOGI(
            "lights",
            "%s schedule: %.1f hours starting at %s; relay should be %s.",
            is_blooming ? "Bloom" : "Vegetative",
            duration_hours,
            start_option.c_str(),
            schedule.lights_should_be_on ? "ON" : "OFF");

        const bool light_is_on = id(${id_prefix}_light_switch).state;
        if (schedule.lights_should_be_on && !light_is_on) {
          id(${id_prefix}_light_switch).turn_on();
          id(${id_prefix}_lights_on) = true;
          id(growbud_controller).reset_irrigation_schedule();
          ESP_LOGI("lights", "Turning lights on.");
        } else if (!schedule.lights_should_be_on && light_is_on) {
          id(${id_prefix}_light_switch).turn_off();
          id(${id_prefix}_lights_on) = false;
          id(growbud_controller).reset_irrigation_schedule();
          ESP_LOGI("lights", "Turning lights off.");
        }

  - id: ${id_prefix}_script
    then:
      lambda: !lambda |-
        auto now = id(growbud_time).now();
        if (!now.is_valid()) {
          ESP_LOGW("lights", "Time is invalid; skipping lighting and irrigation schedule evaluation.");
          return;
        }

        auto start_date_value = id(start_date);
        if (start_date_value->year > 0) {
          id(${id_prefix}_lights_script).execute();
          id(${id_prefix}_pump_script).execute();
        }
